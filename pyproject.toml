[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gguf-dream-lab"
version = "0.1.0"
description = "Local GGUF Dream Lab for realtime latent-state dreaming research"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "GGUF Dream Lab"}]
dependencies = [
  "typer>=0.12",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "plotly>=5.24",
  "dash>=2.18",
  "pyarrow>=17.0",
  "joblib>=1.4",
  "orjson>=3.10",
  "rich>=13.7"
]

[project.optional-dependencies]
llm = ["llama-cpp-python>=0.3.2"]
vis = ["umap-learn>=0.5.6"]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6.9"]

[project.scripts]
gguf-dream-lab = "gguf_dream_lab.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
